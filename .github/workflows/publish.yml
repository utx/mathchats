name: Build book

# Builds the epub on every push. On the default branch it also replaces the
# epub on the "book" release, which is what the website's download link points to.
# (The website itself is served straight from the default branch by GitHub Pages.)
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build epub
        run: ./scripts/build.sh

      - name: Upload epub
        uses: actions/upload-artifact@v4
        with:
          name: mathchats-epub
          path: dist/mathchats.epub

      - name: Publish epub to the "book" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view book >/dev/null 2>&1 || \
            gh release create book --target "$GITHUB_SHA" --title "The book (latest)" \
              --notes "The latest epub, rebuilt automatically whenever a chat changes."
          gh release upload book dist/mathchats.epub --clobber
